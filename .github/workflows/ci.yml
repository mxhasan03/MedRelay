name: CI

# Ordinary CI must not require secrets or external credentials. Installing
# public packages / pulling public images over the network is fine.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  quality:
    name: Lint, type-check, test, migrations, cost audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy .

      - name: Django system check
        run: uv run python manage.py check

      - name: makemigrations --check --dry-run
        run: uv run python manage.py makemigrations --check --dry-run

      - name: pytest (with coverage)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Zero-cost policy audit
        run: uv run python manage.py audit_cost

      - name: Upload COST_AUDIT.md
        uses: actions/upload-artifact@v4
        with:
          name: cost-audit-report
          path: docs/COST_AUDIT.md
          retention-days: 7

  compose-config:
    name: Validate compose.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create throwaway .env for config validation
        run: cp .env.example .env

      - name: docker compose config
        run: docker compose config
