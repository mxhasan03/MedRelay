{% extends "base.html" %}
{% block title %}New Delivery Request — MedRelay (Demo Prototype){% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto p-4">
    <h1>New delivery request for {{ organization.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create and submit</button>
    </form>
</div>
{% endblock %}
