{% extends "base.html" %}
{% block title %}New Delivery Request — MedRelay (Demo Prototype){% endblock %}
{% block content %}
<div style="max-width:45rem;margin:2rem auto;padding:1rem;font-family:sans-serif;">
    <h1>New delivery request for {{ organization.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create and submit</button>
    </form>
</div>
{% endblock %}
