{% extends "base.html" %}
{% block title %}Organization form — MedRelay (Demo Prototype){% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto p-4">
    <h1>{% if object %}Edit {{ object.name }}{% else %}New organization{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
</div>
{% endblock %}
