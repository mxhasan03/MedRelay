{% extends "base.html" %}
{% block title %}Delete facility — MedRelay (Demo Prototype){% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto p-4">
    <h1>Delete {{ object.name }}?</h1>
    <p>This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
        <a href="{% url 'facility-detail' object.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
